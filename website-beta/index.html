<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heimdall Beta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --panel:#050505; --panel-2:#0a0a0a;
  --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.35);
  --text:#ffffff; --muted:rgba(255,255,255,0.55); --muted-2:rgba(255,255,255,0.35);
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,'Courier New',monospace;
  --hud:#5ee7ff; --hud-dim:rgba(94,231,255,0.35);
  --good:#3ddc84; --warn:#ffd166; --critical:#ff6b6b;
}
/* This design deliberately commits to one visual world -- a monochrome
   instrument-panel aesthetic with a single reserved accent -- so it does
   not redefine tokens per theme; it renders identically regardless of
   viewer theme, the same choice the reference (Discovery.AI's own
   frontend) made. */
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-mono); background:var(--bg); color:var(--text);
  overflow-x:hidden; position:relative; font-size:14px; line-height:1.65;
}
::selection{background:#fff; color:#000;}
.mono{font-variant-numeric:tabular-nums;}
a{color:var(--hud);}
h1,h2,h3{font-weight:700; letter-spacing:-0.01em; text-wrap:balance;}

/* ---------- ambient background ---------- */
.bg-layer{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.bg-layer::before{
  content:""; position:absolute; inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 20%, black 40%, transparent 100%);
}
.blob{position:absolute; border-radius:50%; filter:blur(100px); background:#fff; will-change:transform;}
.blob.b1{width:520px; height:520px; top:-200px; left:-140px; opacity:0.055; animation:drift1 26s ease-in-out infinite;}
.blob.b2{width:460px; height:460px; bottom:-220px; right:-120px; opacity:0.05; animation:drift2 32s ease-in-out infinite;}
.blob.b3{width:320px; height:320px; top:40%; left:45%; opacity:0.03; animation:drift3 38s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0);} 50%{transform:translate(80px,60px);}}
@keyframes drift2{0%,100%{transform:translate(0,0);} 50%{transform:translate(-70px,-50px);}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-40px,30px) scale(1.15);}}
@media (prefers-reduced-motion:reduce){.blob{animation:none;}}

/* ---------- corner brackets ---------- */
.page-corner{position:fixed; width:34px; height:34px; pointer-events:none; z-index:60; opacity:0.3;}
.page-corner.tl{top:0; left:0; border-top:2px solid #fff; border-left:2px solid #fff;}
.page-corner.tr{top:0; right:0; border-top:2px solid #fff; border-right:2px solid #fff;}
.page-corner.bl{bottom:0; left:0; border-bottom:2px solid #fff; border-left:2px solid #fff;}
.page-corner.br{bottom:0; right:0; border-bottom:2px solid #fff; border-right:2px solid #fff;}
.corner{position:absolute; width:12px; height:12px; pointer-events:none;}
.corner.tl{top:-1px; left:-1px; border-top:1.5px solid var(--border-strong); border-left:1.5px solid var(--border-strong);}
.corner.br{bottom:-1px; right:-1px; border-bottom:1.5px solid var(--border-strong); border-right:1.5px solid var(--border-strong);}

/* ---------- section-label divider ---------- */
.section-label{display:flex; align-items:center; gap:8px; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); opacity:0.85; margin-bottom:14px;}
.section-label::before{content:"//"; color:rgba(255,255,255,0.8);}
.section-label .line{flex:1; height:1px; background:linear-gradient(90deg, var(--border-strong), transparent);}

.wrap{max-width:1180px; margin:0 auto; padding:0 28px; position:relative; z-index:1;}

/* ---------- top nav ---------- */
.topbar{position:sticky; top:0; z-index:50; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.topbar-inner{display:flex; align-items:center; gap:32px; height:60px; max-width:1180px; margin:0 auto; padding:0 28px;}
.brand{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; letter-spacing:0.02em; white-space:nowrap;}
.brand-mark{width:18px; height:18px; flex:none;}
.brand-beta{font-size:9.5px; font-weight:700; color:var(--hud); border:1px solid var(--hud-dim); border-radius:3px; padding:2px 5px; letter-spacing:0.08em;}
.navlinks{display:flex; gap:2px; flex:1; overflow-x:auto;}
.navlinks button{
  font-family:var(--font-mono); font-weight:500; font-size:12.5px; color:var(--muted);
  background:none; border:none; padding:8px 13px; cursor:pointer; white-space:nowrap;
  text-transform:uppercase; letter-spacing:0.04em; border-bottom:1.5px solid transparent;
  transition:color .15s, border-color .15s;
}
.navlinks button:hover{color:var(--text);}
.navlinks button[aria-current="page"]{color:var(--text); border-bottom-color:var(--hud);}
.navlinks button:focus-visible{outline:1.5px solid var(--hud); outline-offset:2px;}

/* ---------- sections ---------- */
.page{display:none;}
.page.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion:reduce){.page.active{animation:none;}}
section{padding:56px 0;}
section + section{border-top:1px solid var(--border);}
h2.sec-title{font-size:clamp(22px,2.8vw,32px); margin-bottom:12px;}
.sec-sub{color:var(--muted); max-width:64ch; font-size:13.5px; margin-bottom:32px;}

/* ---------- hero ---------- */
.hero{padding:64px 0 52px;}
.hero-grid{display:grid; grid-template-columns:1.15fr 0.85fr; gap:48px; align-items:center;}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;}}
.hero h1{font-size:clamp(28px,4.4vw,46px); line-height:1.08; margin-bottom:18px;}
.hero h1 em{font-style:normal; color:var(--hud);}
.hero-lede{font-size:14.5px; color:var(--muted); max-width:58ch; margin-bottom:26px; line-height:1.7;}
.hero-cta{display:flex; gap:10px; flex-wrap:wrap;}
.btn{font-family:var(--font-mono); font-weight:600; font-size:12.5px; padding:11px 18px; border:1px solid var(--border-strong); cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; transition:transform .12s, border-color .12s, background .12s;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:#fff; color:#000; border-color:#fff;}
.btn-ghost{background:transparent; color:var(--text);}
.btn-ghost:hover{border-color:var(--hud); color:var(--hud);}

/* loop diagram */
.loop{background:var(--panel); border:1px solid var(--border); padding:22px 20px; position:relative;}
.loop-title{font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:14px;}
.loop-stage{display:flex; align-items:center; gap:10px; padding:9px 10px; position:relative;}
.loop-stage .dot{width:6px; height:6px; border-radius:50%; background:var(--hud); flex:none;}
.loop-stage .label{font-size:12.5px; font-weight:500;}
.loop-stage .tag{margin-left:auto; font-size:10px; color:var(--muted-2);}
.loop-stage:not(:last-child)::after{content:""; position:absolute; left:13px; top:calc(100% - 2px); width:1px; height:12px; background:var(--border);}
.loop-stage.world .dot{background:var(--good);}
.loop-stage.control .dot{background:var(--warn);}
.loop-ret{display:flex; gap:8px; margin-top:8px; padding-top:11px; border-top:1px dashed var(--border); font-size:10.5px; color:var(--muted-2);}

/* ---------- stats ---------- */
.statrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:36px;}
.stat{background:var(--panel); padding:18px 18px; position:relative;}
.stat .n{font-size:24px; font-weight:700;}
.stat .l{font-size:10.5px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:0.04em;}

/* panels & grids */
.panel{background:var(--panel); border:1px solid var(--border); padding:22px; position:relative;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
@media (max-width:840px){.grid2,.grid3{grid-template-columns:1fr;}}

/* transaction card */
.txn-card{background:var(--panel); border:1px solid var(--border); padding:18px 20px; margin-bottom:14px; position:relative;}
.txn-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
.txn-id{font-size:12.5px; font-weight:600;}
.pill{font-size:10px; font-weight:700; padding:3px 8px; letter-spacing:0.03em; text-transform:uppercase; border:1px solid;}
.pill-critical{color:var(--critical); border-color:rgba(255,107,107,0.4); background:rgba(255,107,107,0.08);}
.pill-good{color:var(--good); border-color:rgba(61,220,132,0.4); background:rgba(61,220,132,0.08);}
.pill-warn{color:var(--warn); border-color:rgba(255,209,102,0.4); background:rgba(255,209,102,0.08);}
.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:12px;}
.kv div .k{font-size:9.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px;}
.kv div .v{font-size:13px;}

/* pipeline */
.pipeline{border:1px solid var(--border); margin-top:14px;}
.pstage{display:flex; align-items:center; gap:12px; padding:11px 16px; background:var(--panel-2);}
.pstage + .pstage{border-top:1px solid var(--border);}
.pstage .idx{font-size:10px; color:var(--muted-2); width:14px;}
.pstage .name{font-weight:500; font-size:13px; flex:1;}
.pstage .result{font-size:11px; font-weight:700;}
.pstage.pass .result{color:var(--good);}
.pstage.fail{background:rgba(255,107,107,0.06);}
.pstage.fail .result{color:var(--critical);}
.pstage.skip{opacity:0.35;}

/* graph panel */
.graphpanel{background:var(--panel); border:1px solid var(--border); position:relative;}
.graph-toolbar{display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;}
.graph-legend{display:flex; gap:14px; flex-wrap:wrap;}
.graph-legend span{display:flex; align-items:center; gap:5px;}
.legend-dot{width:7px; height:7px; border:1.4px solid; display:inline-block;}
#cy{width:100%; height:460px; cursor:default;}
#graph-hint{padding:8px 16px; font-size:10px; color:var(--muted-2); border-top:1px solid var(--border);}

/* demo beta -- full-screen app, same shell as Discovery.AI's own /app:
   its own slim header, then rail | chat | graph filling the rest of the
   viewport below the site topbar. Edge to edge, no hero copy, no scroll. */
.page#demo{position:relative;}
.page#demo.active{display:flex; flex-direction:column; height:calc(100vh - 61px); overflow:hidden;}
@media (max-width:980px){.page#demo.active{height:auto; overflow:visible;}}
.demo-topbar{flex:none; display:flex; align-items:baseline; gap:14px; padding:13px 22px; border-bottom:1px solid var(--border); background:rgba(255,255,255,0.01); flex-wrap:wrap;}
.demo-topbar h1{font-size:13px; font-weight:700; letter-spacing:0.14em;}
.demo-topbar .sub{font-size:11.5px; color:var(--muted);}
.demo-topbar .meta{margin-left:auto; font-size:10.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.06em; white-space:nowrap;}
.app-shell{display:grid; grid-template-columns:190px 380px 1fr; flex:1; min-height:0;}
@media (max-width:980px){.app-shell{grid-template-columns:1fr; flex:none; height:auto;}}
.rail{border-right:1px solid var(--border); overflow-y:auto; padding:14px 0; min-height:0;}
@media (max-width:980px){.rail{border-right:none; border-bottom:1px solid var(--border); max-height:200px;}}
.rail-head{font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted-2); padding:0 14px 10px;}
.rail-item{padding:10px 14px; cursor:pointer; border-left:2px solid transparent; transition:background .1s, border-color .1s;}
.rail-item:hover{background:rgba(255,255,255,0.03);}
.rail-item.active{border-left-color:var(--hud); background:rgba(94,231,255,0.06);}
.rail-item .t{font-size:12px; color:var(--text); font-weight:500;}
.rail-item .sub{font-size:10px; color:var(--muted-2); margin-top:3px; text-transform:uppercase; letter-spacing:0.03em;}
.rail-item.hint{cursor:default; opacity:0.45;}
.rail-item.hint:hover{background:none;}
.chat-panel{display:flex; flex-direction:column; border-right:1px solid var(--border); min-height:0;}
@media (max-width:980px){.chat-panel{border-right:none; border-bottom:1px solid var(--border); height:520px;}}
.chat-head{padding:12px 16px; border-bottom:1px solid var(--border); font-size:12px; font-weight:700; letter-spacing:0.01em; flex:none;}
.chat-evidence{padding:12px 16px; border-bottom:1px solid var(--border); flex:none; max-height:40%; overflow-y:auto;}
.chat-messages{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-height:0;}
.msg{max-width:94%; font-size:12.5px; line-height:1.6; padding:10px 12px; border:1px solid var(--border); white-space:pre-wrap;}
.msg.assistant{align-self:flex-start; background:var(--panel-2);}
.msg.user{align-self:flex-end; background:rgba(94,231,255,0.06); border-color:var(--hud-dim);}
.msg.err{border-color:rgba(255,107,107,0.4);}
.chat-composer{display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); flex:none;}
.chat-composer input{flex:1; background:#000; border:1px solid var(--border); color:var(--text); font-family:var(--font-mono); font-size:12.5px; padding:9px 10px;}
.chat-composer input:focus{outline:none; border-color:var(--hud);}
.chat-composer input:disabled{opacity:0.4;}
.graph-panel-shell{min-height:0; display:flex; flex-direction:column;}
#demo-cy{width:100%; flex:1; min-height:0; cursor:default;}
.demo-legend{display:flex; flex-wrap:wrap; gap:12px; padding:10px 16px; border-top:1px solid var(--border); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; flex:none;}
.demo-legend-item{display:flex; align-items:center; gap:6px;}
.demo-legend-swatch{width:9px; height:9px; border:1.6px solid; display:inline-block; flex:none;}
.demo-legend-abbr{color:var(--muted-2); text-transform:none; letter-spacing:0;}

/* discovery chain */
.chain{display:flex; align-items:center; gap:0; flex-wrap:wrap; margin:6px 0 26px;}
.chain-node{font-size:11.5px; font-weight:600; padding:8px 13px; background:var(--panel-2); border:1px solid var(--border); white-space:nowrap;}
.chain-arrow{color:var(--muted-2); padding:0 7px; font-size:13px;}

/* verdict cards */
.verdict{background:var(--panel); border:1px solid var(--border); padding:20px; display:flex; flex-direction:column; gap:12px; position:relative;}
.verdict-head{display:flex; justify-content:space-between; align-items:center;}
.verdict-name{font-weight:700; font-size:15px; letter-spacing:0.01em;}
.verdict-metric{display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; padding:6px 0; border-top:1px solid var(--border);}
.verdict-metric .k{color:var(--muted);}
.verdict-metric .v{font-weight:600;}
.verdict-note{font-size:11.5px; color:var(--muted-2); line-height:1.55; padding-top:4px;}

/* doc index */
.doclist{border:1px solid var(--border);}
.docrow{display:flex; align-items:center; gap:16px; padding:14px 18px; background:var(--panel); text-decoration:none; color:inherit;}
.docrow + .docrow{border-top:1px solid var(--border);}
.docrow .path{font-size:12px; color:var(--hud); min-width:230px;}
.docrow .desc{color:var(--muted); font-size:12px;}

/* docs page -- results table */
.doctable{width:100%; border-collapse:collapse; font-size:12px; min-width:640px;}
.doctable th{text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted-2); padding:8px 12px; border-bottom:1px solid var(--border-strong); white-space:nowrap;}
.doctable td{padding:10px 12px; border-bottom:1px solid var(--border); color:var(--muted); vertical-align:top;}
.doctable td:first-child{color:var(--text); font-weight:600; white-space:nowrap;}
.doctable td:last-child{color:var(--muted-2); font-size:10.5px; white-space:nowrap;}

/* roadmap */
.roadgrid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
@media (max-width:840px){.roadgrid{grid-template-columns:1fr;}}
.roadlist{list-style:none; display:flex; flex-direction:column;}
.roadlist li{display:flex; align-items:baseline; gap:10px; padding:8px 0; font-size:13px; border-bottom:1px dashed var(--border);}
.roadlist li .num{font-size:10.5px; color:var(--muted-2); width:24px; flex:none;}
.roadlist.done li .num{color:var(--good);}
.roadlist.next li .num{color:var(--warn);}

footer{padding:36px 0 56px; text-align:center;}
footer p{color:var(--muted-2); font-size:11.5px;}
</style>
</head>
<body>


<div class="bg-layer"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="page-corner tl"></div><div class="page-corner tr"></div><div class="page-corner bl"></div><div class="page-corner br"></div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6v6c0 5.2 3.8 9.4 9 10 5.2-.6 9-4.8 9-10V6l-9-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="11" r="2.6" stroke="currentColor" stroke-width="1.4"/></svg>
      HEIMDALL <span class="brand-beta">BETA</span>
    </div>
    <nav class="navlinks" id="nav"></nav>
  </div>
</div>

<div class="page" id="demo"></div>
<main class="wrap" id="pages"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script>
const D = {
  world: { persons:300, banks:4, merchants:20, days:90, transactions:13509, households:140, devices:259, failures:568 },
  insuff: { id:'txn_00000132', person:'person_00050', merchant:'merchant_0010', amount:437.99, balance:65.92, day:2, income:5477.49 },
  expired: { id:'txn_00000272', person:'person_00141', merchant:'merchant_0009', amount:24.47, balance:1199.63, day:4, income:3335.64 },
  mechCounts: { insufficient_funds:203, expired_instrument:365 },
  edgesRef: { belongs_to:9080, used_device:9080, contains:8814, deposited_as:1770, uses:600 },
  risk: { precision:'100.0%', recall:'96.3%', fpr:'0.0%', tp:26, fp:0, tn:373, fn:1,
          liveBlocked:'dev_00000d', liveDay:49, liveTotal:35 },
  recovery: { rate:'87/87', pct:'100.0%', falseRetry:'39.6%', liveFailures:23, liveRetryDec:23, liveAttempted:22, liveSucceeded:0 },
  controller: { match:'555/610', pct:'91.0%', honest:'47/50', honestPct:'94.0%', investigated:'0/610' }
};

/* Real subgraph, extracted from a real bridged run (seed=7, population=12,
   30 days) via financial_system/bridges -- two customers sharing device

  Merchant:        { color:'#3ddc84', shape:'round-diamond',   short:'MRCH' },

  Settlement:      { color:'rgba(255,255,255,0.4)', shape:'round-rectangle', short:'SETL' },
  BankTransaction: { color:'rgba(255,255,255,0.4)', shape:'round-rectangle', short:'BTXN' },
};

function demoNodeShortLabel(n){
  if(n.type === 'Customer' || n.type === 'Bank' || n.type === 'Merchant') return n.label;
  return NODE_META[n.type].short + ' ' + n.id.slice(-4);
}

function demoNodeInfo(id){
  const n = GRAPH2.nodes.find(x => x.id === id);
  if(!n) return null;
  if(n.type === 'Payment'){
    const v = GRAPH2.paymentVerdicts[id];
    if(!v) return { entity:'Payment', id, rows:[], verdict:null, note:'This payment exists in the graph but was outside this demo’s pre-computed set.' };
    const failed = !!v.decision;
    return {
      entity:'Payment', id, status: failed ? 'FAILED' : 'SUCCEEDED', statusGood: !failed,
      rows:[ ['Amount', money(parseFloat(v.amount))], ['Cause', failed ? v.cause : 'n/a — payment succeeded'] ],
      verdict: failed ? { domain:'Recovery', decision:v.decision, score:v.score, action:v.action, reason:v.reason } : null,
      note: failed
        ? 'Heimdall’s real, unmodified Recovery agent scored this exact payment — called live, for this node, not looked up from a table.'
        : 'This payment succeeded on its own. Recovery is never invoked for a payment that already succeeded — there is nothing to recover.',
    };
  }
  if(n.type === 'Device'){
    const v = GRAPH2.deviceVerdicts[id];
    if(!v) return { entity:'Device', id, rows:[['Owners','1 (not scored — Risk only evaluates devices with 2+ owners)']], verdict:null, note:'A device used by exactly one person is never scored by Risk at all.' };
    return {
      entity:'Device', id, status: v.decision, statusGood: v.decision === 'RELEASE',
      rows:[ ['Owners', v.owners.join(', ')], ['Owner count', String(v.owners.length)] ],
      verdict:{ domain:'Risk', decision:v.decision, score:v.score, action:null, reason:v.reason },
      note:'Heimdall’s real, unmodified Risk agent scored this exact device, live, based on real burst-frequency and account-age signals — not the fact of sharing itself.',
    };
  }
  if(n.type === 'Settlement'){
    const v = GRAPH2.settlementVerdicts[id];
    if(!v) return { entity:'Settlement', id, rows:[], verdict:null, note:'Outside this demo’s pre-computed set.' };
    return {
      entity:'Settlement', id, status: v.decision, statusGood: v.decision === 'PASS',
      rows:[ ['Net amount', money(parseFloat(v.amount))] ],
      verdict:{ domain:'Controller', decision:v.decision, score:v.score, action:v.action, reason:v.reason },
      note:'Heimdall’s real, unmodified Controller agent compared this settlement’s expected amount against what the matched bank transaction actually shows.',
    };
  }
  if(n.type === 'Customer') return { entity:'Customer', id, rows:[['Role','a real Truman person, with a real account and balance']], verdict:null, note:'Every payment below traces back to this one real person’s own state — nothing about their behavior is scripted per-transaction.' };
  if(n.type === 'Bank') return { entity:'Bank (institution)', id, rows:[['Role','holds this customer’s real account; the double-entry ledger records every movement into and out of it']], verdict:null, note:'Truman models a real double-entry ledger — this bank node is not decorative.' };
  if(n.type === 'Merchant') return { entity:'Merchant (institution)', id, rows:[['Category', n.extra && n.extra.category || 'n/a']], verdict:null, note:'The other institution in Truman’s world — receives payment proceeds, which settle into its account on a real T+1 schedule.' };
  if(n.type === 'Order') return { entity:'Order', id, rows:[], verdict:null, note:'The commercial record behind a Payment — what was actually being bought, from which merchant.' };
  if(n.type === 'BankTransaction') return { entity:'Bank transaction', id, rows:[], verdict:null, note:'The real bank-side deposit record Heimdall’s Controller agent matches a Settlement against, to check they agree.' };
  return { entity:n.type, id, rows:[], verdict:null, note:'' };
}

   computed above, cannot write back into decision_score/action/world
   state. Removing this panel removes zero decision logic. */
let sampleFn = null;
let sampleReady = false;
const chatThreads = {}; // id -> { turns:[{role,content}], messages:[{role,content,error?,pending?}], info, busy }

(async () => {
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      sampleFn = await window.claude.use('sample');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildEvidenceBlock(info){
  const v = info.verdict;
  const lines = [ `Entity: ${info.entity} ${info.id}`, ...info.rows.map(([k,val]) => `${k}: ${val}`) ];
  if(v){
    lines.push(`Domain: ${v.domain}`, `Decision: ${v.decision}`, `decision_score: ${v.score}`);
    if(v.action) lines.push(`Proposed action: ${v.action}`);
    lines.push(`Deterministic reason string, already computed by real code: ${v.reason}`);
  } else {
    lines.push(`Note: ${info.note}`);
  }
  return lines.join('\n');
}

function standingInstructions(info){
  return 'You are Discovery.AI, the investigation-narration layer inside a financial system called Heimdall, answering a judge’s questions about one real case in a hackathon demo. This decision was already made by deterministic code before you were ever called — you narrate and answer questions about it, you never re-decide it or invent facts beyond what is given below. When you go beyond the given facts, label that sentence INFERRED: (a reasonable reading of the facts) or HYPOTHESIS: (a plausible but unconfirmed guess); if asked something the evidence doesn’t cover, say UNKNOWN: plainly instead of guessing. Keep answers to a few sentences unless asked for more.\n\nOBSERVED (given, not to be doubted):\n' + buildEvidenceBlock(info);
}

function explainErrorCopy(code){
  const map = {
    not_granted: 'You declined to let this page ask Claude — the rest of the demo still works.',
    sampling_disabled: 'Live reasoning isn’t available for this account.',
    not_declared: 'Live reasoning isn’t enabled on this page.',
    capability_disabled: 'Live reasoning isn’t available in this view.',
    capability_removed: 'Live reasoning isn’t supported by this viewer app.',
    rate_limited: 'Too many requests right now — try again in a moment.',
    session_expired: 'Please sign in again to use this feature.',
    refused: 'Claude declined to answer this one — try again, or ask it differently.',
    empty_completion: 'No answer came back — try again.',
    cancelled: 'Cancelled.',
  };
  return map[code] || 'Something went wrong reaching Claude — try again.';
}

function initChatThread(id){
  if(chatThreads[id]) return;
  const info = demoNodeInfo(id);
  chatThreads[id] = { turns:[{role:'user', content: standingInstructions(info)}], messages:[], info, busy:false };
}

function selectCase(id){
  currentCase = id;
  if(demoCy){
    demoCy.nodes().removeClass('demo-focus');
    const n = demoCy.$id(id);
    if(n.nonempty()){ n.addClass('demo-focus'); demoCy.animate({ center:{ eles:n }, duration:300, easing:'ease-out-cubic' }); }
  }
  initChatThread(id);
  renderRail();
  renderChat();
}

function renderEvidenceCard(info){
  return `
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
      <span style="font-size:12.5px; font-weight:700;">${info.entity} &mdash; ${info.id}</span>
      ${info.status ? `<span class="pill ${info.statusGood?'pill-good':'pill-warn'}">${info.status}</span>` : ''}
    </div>
    ${info.rows.length ? `<div class="kv" style="margin-bottom:${info.verdict?'10px':'0'};">${info.rows.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>` : ''}
    ${info.verdict ? `
      <div class="loop-title" style="margin:6px 0 6px;">// HEIMDALL &mdash; ${info.verdict.domain.toUpperCase()}, REAL VERDICT</div>
      <div class="verdict-metric" style="border-top:none; padding-top:0;"><span class="k">Decision</span><span class="v">${info.verdict.decision}</span></div>
      <div class="verdict-metric"><span class="k">decision_score</span><span class="v">${info.verdict.score}</span></div>
      ${info.verdict.action ? `<div class="verdict-metric"><span class="k">Proposed action</span><span class="v">${info.verdict.action}</span></div>` : ''}
      <p style="font-size:11px; color:var(--muted); line-height:1.55; margin-top:6px;">${info.verdict.reason}</p>` : ''}
    <p style="font-size:10.5px; color:var(--muted-2); line-height:1.6; margin-top:8px;">${info.note}</p>`;
}

function renderChat(){
  const head = document.getElementById('chat-head');
  const evEl = document.getElementById('chat-evidence');
  const msgEl = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const send = document.getElementById('chat-send');
  if(!head) return;
  if(!currentCase){
    head.textContent = 'Select a case';
    evEl.innerHTML = `<p style="font-size:12px; color:var(--muted); line-height:1.7;">Pick a real case on the left, or click any node in the graph. This is a real, connected slice of a bridged Truman run &mdash; two customers, their real bank, four real merchants, their real payments, and one real shared device.</p>`;
    msgEl.innerHTML = '';
    input.disabled = true; send.disabled = true;
    return;
  }
  const thread = chatThreads[currentCase];
  const info = thread.info;
  head.textContent = info.entity + ' — ' + info.id;
  evEl.innerHTML = renderEvidenceCard(info);
  const canAsk = sampleReady && !!sampleFn;
  if(!thread.messages.length){
    msgEl.innerHTML = !sampleReady ? '' : canAsk
      ? `<p style="font-size:11.5px; color:var(--muted-2); line-height:1.6;">Nothing above is looked up from a script &mdash; it was produced by calling Heimdall's real, unmodified decision code once, for this exact node. Ask a question below, on your own Claude account, or tap a quick one:</p>
         <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
           <button class="btn btn-ghost" style="font-size:11px; padding:8px 12px;" onclick="sendChatMessage('Explain this decision for a non-technical judge.')">Explain this decision</button>
           ${info.verdict ? `<button class="btn btn-ghost" style="font-size:11px; padding:8px 12px;" onclick="sendChatMessage('What evidence would change this decision?')">What would change it?</button>` : ''}
         </div>`
      : `<p style="font-size:11.5px; color:var(--muted-2); line-height:1.6;">Live chat with Discovery.AI isn&rsquo;t available in this viewer &mdash; the evidence above is still real.</p>`;
  } else {
    msgEl.innerHTML = thread.messages.map((m,i) => `<div class="msg ${m.role}${m.error?' err':''}" id="msg-${i}">${m.pending && !m.content ? 'Thinking&hellip;' : escapeHtml(m.content)}${m.error ? `<div style="font-size:10.5px; color:var(--muted-2); margin-top:6px;">${explainErrorCopy(m.error)}</div>` : ''}</div>`).join('');
    msgEl.scrollTop = msgEl.scrollHeight;
  }
  input.disabled = !canAsk || thread.busy;
  send.disabled = !canAsk || thread.busy;
}

function submitChatInput(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text || !currentCase) return;
  input.value = '';
  sendChatMessage(text);
}

async function sendChatMessage(text){
  if(!sampleFn || !currentCase) return;
  const id = currentCase;
  const thread = chatThreads[id];
  if(thread.busy) return;
  thread.busy = true;
  thread.messages.push({ role:'user', content:text });
  thread.turns.push({ role:'user', content:text });
  const pendingIdx = thread.messages.length;
  thread.messages.push({ role:'assistant', content:'', pending:true });
  renderChat();
  try{
    const result = await sampleFn(thread.turns, {
      modelTier:'default',
      cache:false,
      onText: (update) => {
        if(currentCase !== id) return;
        thread.messages[pendingIdx].content = update.text;
        const box = document.getElementById('msg-' + pendingIdx);
        if(box) box.textContent = update.text;
      },
    });
    thread.messages[pendingIdx] = { role:'assistant', content:result.text };
    thread.turns.push({ role:'assistant', content:result.text });
  }catch(e){
    thread.messages[pendingIdx] = { role:'assistant', content:(e && e.text) || '', error:(e && e.code) || 'upstream_error' };
  }finally{
    thread.busy = false;
  }
  if(currentCase === id) renderChat();
}

function demoInitGraph(){
  const elements = [
    ...GRAPH2.nodes.map(n => ({ data:{ id:n.id, label: demoNodeShortLabel(n), type:n.type } })),
    ...GRAPH2.edges.map(e => ({ data:{ source:e.from, target:e.to, label:e.rel } })),
  ];
  demoCy = cytoscape({
    container: document.getElementById('demo-cy'),
    elements,
    wheelSensitivity: 0.25,
    style: [
      { selector:'node', style:{
          'label':'data(label)', 'color':'#ffffff', 'font-size':9, 'font-family':'JetBrains Mono, monospace',
          'text-valign':'center', 'text-halign':'center', 'width':'label', 'height':24, 'padding':'8px',
          'shape': (ele) => NODE_META[ele.data('type')].shape, 'background-color':'#000000', 'background-opacity':1,
          'border-width':1.4, 'border-color': (ele) => NODE_META[ele.data('type')].color, 'border-opacity':0.9,
          'text-wrap':'wrap', 'text-max-width':'80px',
      }},
      { selector:'node[type="Customer"]', style:{ 'font-weight':'bold', 'border-width':2, 'height':32 } },
      { selector:'node[type="Bank"], node[type="Merchant"]', style:{ 'font-weight':'bold', 'border-width':1.8 } },
      { selector:'node.demo-focus', style:{ 'background-color':'#ffffff', 'border-color':'#000000', 'border-width':2.5, 'color':'#000000', 'font-weight':'bold' } },
      { selector:'edge', style:{
          'width':1.1, 'line-color':'#ffffff', 'line-opacity':0.2, 'target-arrow-color':'#ffffff',
          'target-arrow-shape':'triangle', 'arrow-scale':0.65, 'curve-style':'bezier',
          'line-style':'dashed', 'line-dash-pattern':[4,3],
      }},
    ],
    layout: { name:'preset' },
  });
  demoCy.layout({
    name:'fcose', quality:'proof', animate:true, animationDuration:500, animationEasing:'ease-out-cubic',
    fit:true, padding:24, nodeDimensionsIncludeLabels:true, tile:true,
    nodeSeparation:75, nodeRepulsion:8000, idealEdgeLength:55, edgeElasticity:0.4,
    gravity:0.25, gravityCompound:0.85, numIter:2500,
  }).run();
  demoCy.on('mouseover','node',()=>{document.getElementById('demo-cy').style.cursor='pointer';});
  demoCy.on('mouseout','node',()=>{document.getElementById('demo-cy').style.cursor='default';});
  demoCy.on('tap','node',(evt)=>{
    selectCase(evt.target.id());
  });
}

function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id===id));
  document.querySelectorAll('#nav button').forEach(b=>{
    if(b.dataset.page===id) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  window.scrollTo({top:0, behavior:'instant'});
  try{ localStorage.setItem('heimdall-beta-page', id); }catch(e){}
  if(id === 'heimdall' && !cyInstance) requestAnimationFrame(initGraph);
  if(id === 'demo' && !demoCy) requestAnimationFrame(() => { demoInitGraph(); renderRail(); renderChat(); });
}

        <tr><td>Historical decision provenance</td><td>A stored decision, replayed against the exact world it was made against, reproduces itself exactly</td><td>decisions/adversarial_test.py</td></tr>
      </tbody>
    </table>
  </div>
</section>
<section>
  <div class="section-label">WHY THIS ISN'T JUST AN LLM WRAPPER<span class="line"></span></div>
  <h2 class="sec-title">Two paths. Only one touches money.</h2>
  <p class="sec-sub">Demo Beta's chat panel makes real, live LLM calls &mdash; on your own Claude account, through the Artifact platform's <code>sample</code> capability &mdash; when you select a case and ask Discovery.AI about it. It's worth being precise about what those calls can and can't do.</p>
  <div class="grid2">
    <div class="panel"><div class="corner tl"></div><div class="corner br"></div>
      <div class="loop-title" style="color:var(--good);">// THE DECISION PATH &mdash; DETERMINISTIC, NO LLM</div>
      <div class="pipeline" style="margin-top:10px;">
        <div class="pstage pass"><span class="idx">1</span><span class="name">Real Python decision code</span><span class="result">run_recovery_for_payment() etc.</span></div>
        <div class="pstage pass"><span class="idx">2</span><span class="name">decision_score</span><span class="result">deterministic, reproducible</span></div>
        <div class="pstage pass"><span class="idx">3</span><span class="name">Policy &rarr; Action</span><span class="result">RETRY / RELEASE / PASS / BLOCK</span></div>
      </div>
      <p class="verdict-note" style="margin-top:12px;">Every verdict on this site &mdash; including every one in Demo Beta &mdash; was computed this way, ahead of time, before this page or any LLM ever saw the case. Re-run the same world with the same seed and every number here reproduces exactly.</p>
    </div>
    <div class="panel"><div class="corner tl"></div><div class="corner br"></div>
      <div class="loop-title" style="color:var(--hud);">// THE NARRATION PATH &mdash; LIVE LLM, AFTER THE FACT</div>
      <div class="pipeline" style="margin-top:10px;">
        <div class="pstage" style="background:var(--panel-2);"><span class="idx">1</span><span class="name">Judge selects a case, asks a question</span><span class="result">explicit action</span></div>
        <div class="pstage" style="background:var(--panel-2);"><span class="idx">2</span><span class="name">Already-computed evidence sent as the leading turn</span><span class="result">OBSERVED only</span></div>
        <div class="pstage" style="background:var(--panel-2);"><span class="idx">3</span><span class="name">Claude replies, labels its own uncertainty</span><span class="result">OBSERVED / INFERRED / HYPOTHESIS / UNKNOWN</span></div>
      </div>
      <p class="verdict-note" style="margin-top:12px;">This call cannot change decision_score, cannot pick an action, and cannot write anything back into the world. Remove the chat panel entirely and every RETRY, BLOCK, and PASS on this page stays exactly the same &mdash; because the LLM was never in that path.</p>
    </div>
  </div>
  <p class="verdict-note" style="margin-top:18px; max-width:74ch;">This mirrors the discipline Discovery.AI already enforces inside Heimdall itself: an investigation's confidence score is carried for audit only and structurally cannot override a lower deterministic decision_score. Demo Beta's live chat applies that same discipline in front of a viewer &mdash; it is not a new exception to it.</p>
</section>
<section>
  <div class="section-label">REAL INCIDENTS THIS PROJECT'S OWN TESTS CAUGHT<span class="line"></span></div>
  <h2 class="sec-title">We caught our own architecture being wrong &mdash; on purpose</h2>
  <p class="sec-sub">Three real bugs, each found by a test built to attack a specific claim, not discovered by accident.</p>
  <div class="grid3">
    <div class="panel"><div class="corner tl"></div><div class="corner br"></div>
      <div class="loop-title" style="margin-bottom:8px;">// 1 &mdash; TIMING BACKWARDS</div>
      <p style="font-size:12px; color:var(--muted); line-height:1.65;">A replay test caught a decision-provenance bug: a decision's recorded "world state at the time" was stamped <i>after</i> the action it authorized had already executed. Replaying the decision against its own recorded world silently saw its own future outcome &mdash; a stored RETRY replayed back as DO_NOT_RETRY. Fixed by moving the timestamp to before the reasoning runs.</p>
    </div>
    <div class="panel"><div class="corner tl"></div><div class="corner br"></div>
      <div class="loop-title" style="margin-bottom:8px;">// 2 &mdash; "WHY" VS "WHETHER"</div>
      <p style="font-size:12px; color:var(--muted); line-height:1.65;">A re-entry test exposed a real gap: after a successful retry, asking Recovery again produced <code>"unrecognized failure_reason=None"</code>. Root cause: Recovery checked <i>why</i> a payment failed but never checked <i>whether</i> it was still failed. Fixed with a general status check, verified identical whether resolved on attempt 1, attempt 2, or never retried.</p>
    </div>
    <div class="panel"><div class="corner tl"></div><div class="corner br"></div>
      <div class="loop-title" style="margin-bottom:8px;">// 3 &mdash; WE CORRECTED OURSELVES</div>
      <p style="font-size:12px; color:var(--muted); line-height:1.65;">An early pass claimed 19 of 610 settlements had a payment-sum inconsistency. Building the real check revealed the naive sum wasn't deduplicating a repeated settlement-payment link &mdash; those 19 were entirely the already-known duplicate_record anomaly. Corrected in the same document that made the original claim, not silently dropped.</p>
    </div>
  </div>
</section>
<section>
  <div class="section-label">LIMITATIONS<span class="line"></span></div>
  <h2 class="sec-title">Stated up front, not discovered under questioning</h2>
  <div class="panel"><div class="corner tl"></div><div class="corner br"></div>
    <ul style="list-style:none; display:flex; flex-direction:column; gap:12px; margin:0; padding:0;">
      <li style="font-size:12.5px; color:var(--muted); line-height:1.6; padding-bottom:12px; border-bottom:1px dashed var(--border);"><b style="color:#fff;">Simulated gateway, not a live payment API.</b> The harness the architecture is built to plug a real gateway into, not a claim of production readiness.</li>
      <li style="font-size:12.5px; color:var(--muted); line-height:1.6; padding-bottom:12px; border-bottom:1px dashed var(--border);"><b style="color:#fff;">decision_score is a category base rate</b>, never a per-instance prediction &mdash; a deliberate design choice, stated as one. A 0% false-retry rate would require an oracle.</li>
      <li style="font-size:12.5px; color:var(--muted); line-height:1.6; padding-bottom:12px; border-bottom:1px dashed var(--border);"><b style="color:#fff;">Reasoning and decisions are not fully event-sourced.</b> Only what happened in the world and what actions executed are reconstructable at an arbitrary point in time &mdash; a named, deliberate boundary.</li>
      <li style="font-size:12.5px; color:var(--muted); line-height:1.6; padding-bottom:12px; border-bottom:1px dashed var(--border);"><b style="color:#fff;">Historical replay is conditional, not absolute</b> &mdash; proven correct assuming entity resolution hasn't changed since.</li>
      <li style="font-size:12.5px; color:var(--muted); line-height:1.6;"><b style="color:#fff;">No general ledger.</b> A researched, deliberate decision: two targeted accounting-consistency checks exposed a real gap without building a second, unproven financial subsystem in the time available.</li>
    </ul>
  </div>
</section>
<section>
  <div class="section-label">WHY IT'S BUILT THIS WAY<span class="line"></span></div>
  <h2 class="sec-title">One-directional, by design</h2>
  <p class="sec-sub">Truman can run and be fully tested with zero knowledge that Heimdall exists. Heimdall can run and be fully tested with zero knowledge that Truman exists (it already was &mdash; against the real dataset, before Truman was built). The bridge is the only new coupling, and it's additive: deleting it costs neither system anything.</p>
  <div class="panel" style="margin-bottom:0;"><div class="corner tl"></div><div class="corner br"></div>
    <div class="loop-stage"><span class="dot" style="background:var(--good);"></span><span class="label">Truman generates a world</span><span class="tag">no Heimdall dependency</span></div>
    <div class="loop-stage"><span class="dot" style="background:var(--hud);"></span><span class="label">Bridge transforms + ingests it</span><span class="tag">financial_system/bridges/</span></div>
    <div class="loop-stage"><span class="dot" style="background:var(--warn);"></span><span class="label">Heimdall's real, unmodified code decides</span><span class="tag">Risk / Recovery / Controller</span></div>
    <div class="loop-stage"><span class="dot" style="background:var(--warn);"></span><span class="label">Discovery.AI investigates, only if needed</span><span class="tag">0/610 calls, this run</span></div>
    <div class="loop-stage" style="border:none;"><span class="dot" style="background:var(--good);"></span><span class="label">Action feeds back into Truman (live loop only)</span><span class="tag">Recovery + Risk</span></div>
  </div>
</section>
<section>
  <div class="section-label">MATURITY, STATED HONESTLY<span class="line"></span></div>
  <h2 class="sec-title">Truman and the bridge &mdash; what's real vs. still a diagram</h2>
  <p class="sec-sub">The same standard as Limitations above, applied to everything built beyond the frozen, submitted core.</p>
  <div class="roadgrid">
    <div>
      <div class="section-label" style="color:var(--good);">SOLID<span class="line"></span></div>
      <p style="font-size:12px; color:var(--muted); line-height:1.7;">The causal mechanism itself, double-entry ledger correctness, determinism (tested at every layer, including the live loop), the zero-impact boundary against Heimdall's frozen code &mdash; proven, not assumed, on every single addition.</p>
    </div>
    <div>
      <div class="section-label" style="color:var(--hud);">REAL, SMALL-SCALE<span class="line"></span></div>
      <p style="font-size:12px; color:var(--muted); line-height:1.7;">The live loop has only been run and verified against small populations (20&ndash;50 people) &mdash; not stress-tested at the scale the batch bridge runs at (hundreds of people, thousands of transactions).</p>
    </div>
    <div>
      <div class="section-label" style="color:var(--warn);">GENUINELY UNCALIBRATED<span class="line"></span></div>
      <p style="font-size:12px; color:var(--muted); line-height:1.7;">Most of Truman's constants are labeled, honest modeling assumptions, not verified against real data. <code>Simulation/docs/Research.md</code> documents which are cited and which numbers were deliberately rejected for failing verification.</p>
    </div>
    <div>
      <div class="section-label" style="color:var(--critical);">NOT BUILT AT ALL<span class="line"></span></div>
      <p style="font-size:12px; color:var(--muted); line-height:1.7;">Fraud, credit scoring, and loan mechanics exist only as cited design proposals. Controller has no live loop yet. The registry/catalog tools are structured indexes maintained by explicit decisions, not autonomous discovery.</p>
    </div>
  </div>
  <div class="panel" style="margin-top:20px;"><div class="corner tl"></div><div class="corner br"></div>
    <div class="loop-title" style="margin-bottom:8px;">// A REAL FINDING FROM THE DRIFT DETECTOR</div>
    <p style="font-size:12px; color:var(--muted); line-height:1.7;">The drift detector checks Heimdall's live decisions against Truman's own <i>known</i> mechanisms &mdash; the one advantage a built simulator has over a real dataset. It already found one real, statistically significant case (p=2.6&times;10&#8315;&#8310;): Recovery's stated 0.45 confidence for <code>insufficient_funds</code> didn't match Truman's realized 0% retry-success rate &mdash; correctly traced to the live loop's fixed 1-day retry window colliding with Truman's monthly-payday-only income model, not a flaw in Heimdall's own logic.</p>
  </div>
</section>
<section>
  <div class="section-label">GLOSSARY<span class="line"></span></div>
  <h2 class="sec-title">Short terms, precisely defined</h2>
  <div class="grid2">
    <div class="kv" style="grid-template-columns:1fr; gap:16px;">
      <div><div class="k">decision_score</div><div class="v" style="font-size:12px; color:var(--muted); font-weight:400; margin-top:3px;">A deterministic number (a lookup, arithmetic check, or category base rate) &mdash; never an LLM's opinion, never a per-instance prediction.</div></div>
      <div><div class="k">PolicyDecision</div><div class="v" style="font-size:12px; color:var(--muted); font-weight:400; margin-top:3px;">The record that authorizes an action. Has no field for investigation_confidence at all &mdash; structurally, not by convention.</div></div>
      <div><div class="k">Discovery.AI</div><div class="v" style="font-size:12px; color:var(--muted); font-weight:400; margin-top:3px;">The recursive investigation engine, invoked only when deterministic evidence runs out. Investigates; never decides.</div></div>
    </div>
    <div class="kv" style="grid-template-columns:1fr; gap:16px;">
      <div><div class="k">Event sourcing</div><div class="v" style="font-size:12px; color:var(--muted); font-weight:400; margin-top:3px;">Append-only, closed event taxonomy; current state is a projection of the event log, not a second source of truth.</div></div>
      <div><div class="k">Idempotent action</div><div class="v" style="font-size:12px; color:var(--muted); font-weight:400; margin-top:3px;">The same action request twice produces exactly one execution; a crash mid-execution never silently re-executes.</div></div>
      <div><div class="k">Mechanism</div><div class="v" style="font-size:12px; color:var(--muted); font-weight:400; margin-top:3px;">In Truman, a general concept describing a full transition process with multiple possible outcomes (e.g. Authentication) &mdash; not just a single failure mode.</div></div>
    </div>
  </div>
</section>
